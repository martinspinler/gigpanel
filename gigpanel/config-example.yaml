prefixes:
  cloud: 'cloud/data/'
  docs: 'Documents/'
stores:
  sheets:
    prefix: docs
    path: 'sheets/'
    suffix: '.pdf'
  arrangements:
    prefix: cloud
    path: 'band/scores/'
    pattern: 'band/scores/{name}/{name}{instrument}.pdf'
    suffix: '.pdf'

defaultStore: arrangements
defaultPlaylistClient: mygreatband

# Online (socketiolivelist) sheet-store resolution.
# The {patterns, instruments} config comes from the server's band DB
# (fetched with the songlist and cached for offline use); only the
# machine-specific filesystem prefix lives here. sheet_store_instrument
# selects which instrument the gigpanel auto-picks (no dialog).
sheet_store_prefix: ''
sheet_store_instrument: 'pno'

playlistClients:
  mygreatband:
    currentBand: 1
    url: 'http://127.0.0.1:8012/band/mygreatband'

midibox:
  default-configuration: midibox
  configurations:
    midibox:
      backend: osc
      backend-params:
        addr: midibox
        port: 4302
    local:
      backend: osc
      backend-params:
        addr: localhost
        port: 4302
    simulator:
      backend: simulator
